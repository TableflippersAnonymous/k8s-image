# Node identity table.
#
# Nodes are identified by the SMBIOS UUID exposed at
# /sys/class/dmi/id/product_uuid.  The node number drives every address the
# node holds, and matches the switch port allocation: node N takes e1/N on
# both sw-dc-xe switches (one leg of a vPC), and its BMC lands on
# e1/20+N (k8s-01..09, sw-dc-xe-1) or e1/11+N (k8s-10..17, sw-dc-xe-2).
#
#   bond private (eth4+eth5, 802.3ad across the vPC)
#     private  vlan 14 native   10.199.14.N/24
#     public   vlan 12 tagged   144.86.176.N/27, 2602:f3ad::N/64
#     cluster  vlan 17 tagged   10.199.17.N/24
#
# The BMC sits on the admin network at 10.199.11.N, out of band on its own
# switch port; it is not visible to the OS at all.
#
# A node whose UUID is absent from this table will refuse to configure
# networking rather than guess.  Add the machine here and rebuild the image.
#
# product_uuid                          node
